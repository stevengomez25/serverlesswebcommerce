[build]
  command = "npm run build"
  publish = "dist/blog-estatico/browser"

# Desactiva el runtime de SSR de Netlify para forzar que sea 100% estático
[[plugins]]
  package = "@netlify/plugin-omit-netlify-files"

# Reglas de enrutamiento
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200