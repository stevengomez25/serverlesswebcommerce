[build]
  command = "npm run build"
  publish = "dist/blog-estatico/browser"

# Esto asegura que cualquier ruta que no sea un archivo físico vaya al index de Angular, 
# pero la carpeta /admin ya viaja física en el build y cargará directo.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200